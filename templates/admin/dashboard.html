{% extends "admin/layout.html" %}
{% block page_title %}Dashboard{% endblock %}

{% block content %}
<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-glow blue"></div>
        <div class="stat-icon blue"><i class="bi bi-folder-fill"></i></div>
        <div class="stat-label">Projects</div>
        <div class="stat-value">{{ project_count }}</div>
        <a href="{{ url_for('admin_projects') }}" class="stat-link">
            View Details <i class="bi bi-chevron-right"></i>
        </a>
    </div>

    <div class="stat-card">
        <div class="stat-glow green"></div>
        <div class="stat-icon green"><i class="bi bi-journal-text"></i></div>
        <div class="stat-label">Blog Posts</div>
        <div class="stat-value">{{ blog_count }}</div>
        <a href="{{ url_for('admin_blogs') }}" class="stat-link">
            View Details <i class="bi bi-chevron-right"></i>
        </a>
    </div>

    <div class="stat-card">
        <div class="stat-glow yellow"></div>
        <div class="stat-icon yellow"><i class="bi bi-envelope-fill"></i></div>
        <div class="stat-label">Messages</div>
        <div class="stat-value">{{ contact_count }}</div>
        <a href="{{ url_for('admin_contacts') }}" class="stat-link">
            View Details <i class="bi bi-chevron-right"></i>
        </a>
    </div>
</div>
{% endblock %}
