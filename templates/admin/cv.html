{% extends "admin/layout.html" %}
{% block page_title %}CV Manager{% endblock %}

{% block content %}
<div class="section-header">
    <h2>CV / Resume Manager</h2>
</div>

<div class="card" style="max-width:560px;">
    <div class="card-header">Upload CV</div>
    <div class="card-body">
        {% if cv_url %}
        <div style="margin-bottom:1.5rem; padding:1rem; background:#f0fdf4; border:1px solid #bbf7d0; border-radius:8px; display:flex; align-items:center; gap:0.75rem;">
            <i class="bi bi-check-circle-fill" style="color:#16a34a; font-size:1.25rem;"></i>
            <div>
                <div style="font-weight:600; font-size:0.9rem; color:#166534;">CV is uploaded</div>
                <a href="{{ cv_url }}" target="_blank" style="font-size:0.8rem; color:#16a34a;">View current CV</a>
            </div>
        </div>
        {% else %}
        <div style="margin-bottom:1.5rem; padding:1rem; background:#fef3c7; border:1px solid #fde68a; border-radius:8px; display:flex; align-items:center; gap:0.75rem;">
            <i class="bi bi-exclamation-triangle-fill" style="color:#d97706; font-size:1.25rem;"></i>
            <div>
                <div style="font-weight:600; font-size:0.9rem; color:#92400e;">No CV uploaded yet</div>
                <div style="font-size:0.8rem; color:#92400e;">Upload a PDF below</div>
            </div>
        </div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label">PDF File</label>
                <input type="file" name="cv_file" class="form-control" accept=".pdf" required>
                <div class="form-help">Upload your CV as a PDF file</div>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-upload"></i> Upload CV
            </button>
        </form>
    </div>
</div>
{% endblock %}
