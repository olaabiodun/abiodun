<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #343a40;
        }

        .sidebar a {
            color: #fff;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
        }

        .sidebar a:hover {
            background-color: #495057;
        }

        .sidebar .active {
            background-color: #0d6efd;
        }

        .main-content {
            padding: 20px;
        }
    </style>
</head>

<body>
    <div class="d-flex">
        <div class="sidebar d-flex flex-column flex-shrink-0 p-3 text-white" style="width: 280px;">
            <a href="{{ url_for('admin_dashboard') }}"
                class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <span class="fs-4">Admin Panel</span>
            </a>
            <hr>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="{{ url_for('admin_dashboard') }}"
                        class="nav-link {{ 'active' if request.endpoint == 'admin_dashboard' else '' }}">
                        <i class="bi bi-speedometer2 me-2"></i> Dashboard
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('admin_projects') }}"
                        class="nav-link {{ 'active' if 'admin_projects' in request.endpoint or 'admin_project' in request.endpoint else '' }}">
                        <i class="bi bi-folder me-2"></i> Projects
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('admin_blogs') }}"
                        class="nav-link {{ 'active' if 'admin_blogs' in request.endpoint or 'admin_blog' in request.endpoint else '' }}">
                        <i class="bi bi-journal-text me-2"></i> Blog Posts
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('admin_contacts') }}"
                        class="nav-link {{ 'active' if 'admin_contacts' in request.endpoint else '' }}">
                        <i class="bi bi-envelope me-2"></i> Contacts
                    </a>
                </li>
            </ul>
            <hr>
            <div>
                <a href="{{ url_for('index') }}" class="nav-link text-white">
                    <i class="bi bi-box-arrow-right me-2"></i> Back to Site
                </a>
            </div>
        </div>
        <div class="flex-grow-1 main-content">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category if category != 'message' else 'info' }} alert-dismissible fade show"
                role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
